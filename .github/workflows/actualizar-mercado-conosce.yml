name: Probar actualizacion Mercado CONOSCE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar lector Excel
        run: python -m pip install openpyxl==3.1.5

      - name: Descargar Excel oficial
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          import zipfile
          from pathlib import Path

          url = (
              "https://conosce.osce.gob.pe/buscador/assets/"
              "67ae6c4a/reportes/adjudicaciones/2026/"
              "CONOSCE_ADJUDICACIONES_SIE2026_0.xlsx"
          )
          path = Path("conosce_actual.xlsx")

          req = urllib.request.Request(
              url, headers={"User-Agent": "Mozilla/5.0"}
          )
          with urllib.request.urlopen(req, timeout=90) as response:
              with path.open("wb") as output:
                  while True:
                      chunk = response.read(1024 * 1024)
                      if not chunk:
                          break
                      output.write(chunk)
                      if output.tell() > 20 * 1024 * 1024:
                          raise RuntimeError("Excel supera limite")

          if not zipfile.is_zipfile(path):
              raise RuntimeError("Descarga no es Excel valido")

          print("DESCARGA_CONOSCE=PASS")
          print("BYTES=", path.stat().st_size)
          PY

      - name: Simular actualizacion incremental
        run: |
          python cloud/actualizar_mercado_conosce.py \
            --excel conosce_actual.xlsx \
            --json docs/mercado_items.json

      - name: Confirmar que no se modifico el dashboard
        shell: bash
        run: |
          test -z "$(git status --porcelain -- docs)"
          echo "DASHBOARD_INTACTO=SI"
          echo "PRUEBA_CLOUD=PASS"