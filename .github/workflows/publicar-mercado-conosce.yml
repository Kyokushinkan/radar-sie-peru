name: Actualizar Mercado SIE CONOSCE

on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercado-sie-conosce
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: python -m pip install openpyxl==3.1.5

      - name: Descargar Excel CONOSCE
        shell: bash
        run: |
          set -Eeuo pipefail

          URL="https://conosce.osce.gob.pe/buscador/assets/67ae6c4a/reportes/adjudicaciones/2026/ADJUDICACIONES_SIE2026_0.xlsx"
          FILE="conosce_actual.xlsx"

          for intento in 1 2 3 4; do
            echo "DESCARGA_INTENTO=$intento"
            rm -f "$FILE"

            if codigo=$(curl -4 --http1.1 --fail --location --silent --show-error --connect-timeout 15 --max-time 75 --max-filesize 20971520 --user-agent "Mozilla/5.0" --output "$FILE" --write-out "%{http_code}" "$URL"); then
              echo "HTTP=$codigo"

              if python -c 'from pathlib import Path; import zipfile; p=Path("conosce_actual.xlsx"); assert p.stat().st_size > 10000; assert zipfile.is_zipfile(p); print("EXCEL_VALIDO_BYTES=",p.stat().st_size)'; then
                echo "DESCARGA_CONOSCE=PASS"
                exit 0
              fi

              echo "EXCEL_INVALIDO=SI"
            else
              echo "DESCARGA_FALLIDA_INTENTO=$intento HTTP=${codigo:-000}"
            fi

            if [ "$intento" -lt 4 ]; then
              sleep $((intento * 7))
            fi
          done

          echo "::error::No se pudo obtener el Excel oficial desde GitHub Actions. No se publicaran datos incompletos."
          exit 1

      - name: Actualizar JSON
        run: |
          python cloud/reconciliar_mercado_conosce.py \
            --excel conosce_actual.xlsx \
            --json docs/mercado_items.json \
            --auditoria docs/mercado_cambios.json \
            --aplicar

      - name: Validar JSON actualizado
        shell: bash
        run: |
          python - <<'PY'
          import json

          with open("docs/mercado_items.json", encoding="utf-8") as f:
              data = json.load(f)

          records = data["datos"]
          keys = [
              (r["codigo_convocatoria"], r["numero_item"])
              for r in records
          ]

          assert len(keys) == len(set(keys))
          assert len(records) >= 6209
          assert data["resumen"]["items"] == len(records)

          print("ITEMS_VALIDADOS=", len(records))
          print("VALIDACION_PUBLICACION=PASS")
          PY

      - name: Publicar solamente Mercado SIE
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- docs/mercado_items.json docs/mercado_cambios.json

          if git diff --cached --quiet; then
            echo "SIN_CAMBIOS_PARA_PUBLICAR=SI"
            exit 0
          fi

          git commit -m "Actualizar adjudicaciones Mercado SIE desde CONOSCE"
          git push origin HEAD:main

          echo "PUBLICACION_MERCADO_SIE=PASS"